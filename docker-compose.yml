services:
  db:
    image: postgres:17-alpine
    container_name: meeting-rooms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: meeting-rooms-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: 3000
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS}
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE}
      OFFICE_OPEN_HOUR: ${OFFICE_OPEN_HOUR}
      OFFICE_CLOSE_HOUR: ${OFFICE_CLOSE_HOUR}
      WEB_BASE_URL: ${WEB_BASE_URL}
    command: sh -c "npm run db:deploy -w @meeting-rooms/api && npm run start -w @meeting-rooms/api"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: meeting-rooms-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT}:80'

volumes:
  db-data:
